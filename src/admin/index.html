<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>管理画面 | NESTON Games Hub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="bar">
    <h1>NESTON Games Hub 管理画面</h1>
  </header>

  <main>
    <!-- 管理 -->
    <div id="admin-view">
      <nav class="tabs">
        <button type="button" data-tab="games" class="active">ゲーム</button>
        <button type="button" data-tab="comments">コメント <span id="pending-count"></span></button>
      </nav>

      <section id="tab-games" class="panel">
        <div class="row">
          <button id="new-game" type="button">＋ ゲームを追加</button>
        </div>
        <ul id="game-list" class="items"></ul>
      </section>

      <section id="tab-comments" class="panel" hidden>
        <div class="row">
          <label><input type="radio" name="cstatus" value="pending" checked> 承認待ち</label>
          <label><input type="radio" name="cstatus" value="approved"> 公開中</label>
        </div>
        <ul id="comment-list" class="items"></ul>
      </section>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <dialog id="game-dialog" class="modal">
      <form id="game-form" class="game-form">
        <h3 id="game-form-title"></h3>
        <label>ゲームのURL <input name="url" required></label>
        <div class="row">
          <button type="button" id="fetch-info">ゲーム情報を取得</button>
        </div>
        <label>タイトル <input name="title" required maxlength="60"></label>
        <label>作者 <input name="author" maxlength="40"></label>
        <label>説明 <textarea name="description" rows="6" maxlength="300"></textarea></label>
        <label>サムネイルURL <input name="thumbnail"></label>
        <img id="thumb-preview" class="thumb-preview" alt="サムネイル プレビュー" hidden>
        <label class="inline"><input type="checkbox" name="visible" checked> 公開する</label>
        <p id="form-status" class="status" aria-live="polite"></p>
        <div class="row">
          <button type="submit">保存</button>
          <button type="button" id="game-cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="comments-dialog" class="modal">
      <div class="modal-head">
        <h3 id="comments-dialog-title"></h3>
        <button type="button" id="comments-dialog-close">閉じる</button>
      </div>
      <ul id="comments-dialog-list" class="items"></ul>
    </dialog>
  </main>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
