<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>管理画面 | NESTON Games Hub</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="bar">
    <h1>NESTON Games Hub 管理画面</h1>
  </header>

  <main>
    <!-- 管理 -->
    <div id="admin-view">
      <nav class="tabs">
        <button type="button" data-tab="games" class="active">ゲーム</button>
        <button type="button" data-tab="comments">コメント <span id="pending-count"></span></button>
      </nav>

      <section id="tab-games" class="panel">
        <div class="row">
          <button id="new-game" type="button">＋ ゲームを追加</button>
        </div>
        <form id="game-form" class="game-form" hidden>
          <h3 id="game-form-title"></h3>
          <label>ゲームのURL(https://…。ScratchまたはTurboWarpの作品URLなら自動判定します) <input name="url" required></label>
          <div class="row">
            <button type="button" id="fetch-scratch">Scratch/TurboWarpの情報を取得</button>
          </div>
          <label>タイトル <input name="title" required maxlength="60"></label>
          <label>作者 <input name="author" maxlength="40"></label>
          <label>説明 <textarea name="description" rows="2" maxlength="300"></textarea></label>
          <label>サムネイル(assets/thumbs/xxx.png か https://…) <input name="thumbnail"></label>
          <label class="inline"><input type="checkbox" name="visible" checked> 公開する</label>
          <div class="row">
            <button type="submit">保存</button>
            <button type="button" id="game-cancel">キャンセル</button>
          </div>
        </form>
        <ul id="game-list" class="items"></ul>
      </section>

      <section id="tab-comments" class="panel" hidden>
        <div class="row">
          <label><input type="radio" name="cstatus" value="pending" checked> 承認待ち</label>
          <label><input type="radio" name="cstatus" value="approved"> 公開中</label>
        </div>
        <ul id="comment-list" class="items"></ul>
      </section>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
